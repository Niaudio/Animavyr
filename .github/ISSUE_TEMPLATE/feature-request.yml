name: Feature Request
description: Suggest an Animavyr workflow or usability improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Creative or production problem
      description: What are you trying to accomplish, and where does the current workflow become difficult?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result rather than prescribing a specific implementation.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Story and worldbuilding
        - Characters and scenes
        - Audio and motion
        - Keyframes and storyboard
        - ComfyUI workflow
        - LM Studio and AI assistance
        - Export and publication
        - Installation and settings
        - Other
    validations:
      required: true
